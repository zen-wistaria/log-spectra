name: logspectra
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TITLE=${TITLE}
        - VERSION=${VERSION}
        - DESCRIPTION=${DESCRIPTION}
        - LICENSES=${LICENSES}
        - SOURCE=${SOURCE}
        - URL=${URL}
        - AUTHORS=${AUTHORS}
        - BUILD_DATE=${BUILD_DATE}
        - BUILD_SOURCE=${BUILD_SOURCE}
        - VCS_REF=${VCS_REF}
    env_file:
      - .env.docker
    container_name: logspectra
    image: logspectra:latest
    ports:
      - "3000:3000"
    volumes:
      - .env:/app/.env
    depends_on:
      - database

  database:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
