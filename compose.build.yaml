services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sample-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - nginx
    
  nginx:
    image: nginx:stable-alpine
    container_name: sample-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx:rw
