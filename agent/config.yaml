# ============================================
# Log Anomaly Detection Agent — Configuration
# ============================================

# Path to nginx access log file
log_path: "/var/log/nginx/access.log"

# Main server base URL (where the Next.js app is running)
server_url: "https://domain.com"

# API endpoint path on the main server
api_endpoint: "/api/v1/collects"

# Heartbeat endpoint path on the main server
# Agent sends heartbeat on a separate thread to maintain online status
heartbeat_endpoint: "/api/v1/agents/heartbeat"

# Heartbeat interval in seconds (default: 300 = 5 minutes, max: 600 = 10 minutes)
# How often the agent sends a heartbeat to indicate it is online.
heartbeat_interval: 300

# Bearer token for API authentication
# Generate this from the main server and paste here
auth_token: "your-secret-token-here"

# Isolation Forest parameters
n_estimators: 200
contamination: 0.02

# Analysis interval in seconds (default: 300 = 5 minutes)
analysis_interval: 300

# Minimum log lines required before first analysis is run.
# Agent will wait until at least this many log entries are accumulated.
min_log_lines: 100

# Maximum size for accumulated log file in MB (default: 200, max: 500).
# When the file exceeds this size, oldest entries are trimmed automatically.
# The accumulated log persists across log rotations.
accumulated_log_max_size_mb: 200

# Minimum risk score for an IP to be included in the report to the server.
# IPs with a risk score at or above this threshold will be sent.
# Default: 60, min: 0, max: 100
min_risk_score_to_send: 60

# Retry settings for HTTP requests
retry_max: 3
retry_backoff: 2

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"

# In-memory buffer: max log entries in internal buffer (sliding window)
# Buffer is used for Isolation Forest analysis. Kept small to bound memory.
# Default: 100000 (~1-3 days at 1000 req/min, ~1 week at 100 req/min)
buffer_max_lines: 100000
